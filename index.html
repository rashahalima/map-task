<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="map" style="display: none"></div>
    <div id="results"></div>
    <form id="main-form">
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="fname" required />
      <br />
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lname" required />
      <br />
      <label>Gender</label><br />
      <input type="radio" id="male" name="gender" value="MALE" required />
      <label for="male">Male</label><br />
      <input type="radio" id="female" name="gender" value="FEMALE" />
      <label id="f" for="female">Female</label>
      <br />

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required min="18" max="80" />
      <br />

      <label for="lat">Latitude</label>
      <input type="number" step="any" id="lat" name="lat" required />

      <label for="lon">Longitude</label>
      <input type="number" step="any" id="lon" name="lon" required /><br />

      <button type="submit" id="add">Add</button>

      <button type="button" id="draw" disabled>Draw</button>
      <button type="button" id="btn-test">test cases</button>

    </form>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./js/lib.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
